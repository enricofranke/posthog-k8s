suite: workloads
templates:
  - workloads.yaml
tests:
  - it: renders web as a Deployment with the pinned posthog image and non-root security context
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: ^posthog/posthog:[0-9a-f]{40}
      - equal:
          path: spec.template.spec.containers[0].command
          value: ["/bin/bash", "/chart/start.sh"]
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: passes secrets by reference, never as plain values
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-posthog-env
                key: SECRET_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-posthog-env
                key: DATABASE_URL
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SECRET_KEY
            value: ""
          any: true

  - it: routes a mapped secret key to the user's own Secret
    set:
      secrets.keys.DATABASE_URL: {secret: my-pg-app, key: uri}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: worker
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: my-pg-app
                key: uri

  - it: rewrites compose hostnames to release-scoped services
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            value: redis://RELEASE-NAME-posthog-redis7:6379/
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: RELEASE-NAME-posthog-clickhouse

  - it: uses the external Postgres host and skips the bundled Redis when configured
    set:
      postgresql.external.host: pg.example.internal
      redis.external.host: redis.example.internal
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGHOST
            value: pg.example.internal
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: web
      - hasDocuments:
          count: 0
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: redis7
          skipEmptyTemplates: true

  - it: renders ClickHouse as a StatefulSet with a volume claim and the init container copying image assets
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: clickhouse
    asserts:
      - isKind:
          of: StatefulSet
      - equal:
          path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 100Gi
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: copy-upstream
      - matchRegex:
          path: spec.template.spec.initContainers[0].args[0]
          pattern: cp -r /code/posthog/user_scripts

  - it: honours services.<name>.enabled=false
    set:
      services.browserless.enabled: false
    asserts:
      - hasDocuments:
          count: 0
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: browserless
          skipEmptyTemplates: true

  - it: lets services.<name>.env override an upstream variable instead of duplicating it
    set:
      services.web.env:
        - {name: GRANIAN_WORKERS, value: "1"}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: GRANIAN_WORKERS, value: "1"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: GRANIAN_WORKERS, value: "2"}


  - it: binds StatefulSet claims to labelled PersistentVolumes through persistence.selector
    set:
      services.clickhouse.persistence:
        storageClass: local-retain
        selector: {matchLabels: {storage.example/purpose: clickhouse-posthog}}
      services.zookeeper.persistence:
        selector: {matchLabels: {purpose: zk-data}}
        extraOverrides:
          datalog: {selector: {matchLabels: {purpose: zk-datalog}}, size: 3Gi}
    asserts:
      - equal:
          path: spec.volumeClaimTemplates[0].spec.selector.matchLabels["storage.example/purpose"]
          value: clickhouse-posthog
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: clickhouse
      - equal:
          path: spec.volumeClaimTemplates[1].spec.selector.matchLabels.purpose
          value: zk-datalog
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: zookeeper
      - equal:
          path: spec.volumeClaimTemplates[1].spec.resources.requests.storage
          value: 3Gi
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: zookeeper

  - it: lets values replace a service readiness probe handler and derives the startup probe from it
    set:
      services:
        browserless:
          readinessProbe:
            tcpSocket:
              port: http
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: browserless
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: http
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet
      - equal:
          path: spec.template.spec.containers[0].startupProbe.tcpSocket.port
          value: http
      - notExists:
          path: spec.template.spec.containers[0].startupProbe.httpGet

  - it: keeps the upstream readiness probe when values do not override it
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: browserless
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /pressure
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /pressure

  - it: lets values change the zookeeper pod user so it matches a pre-provisioned local volume
    set:
      services:
        zookeeper:
          podSecurityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: zookeeper
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.fsGroupChangePolicy
          value: OnRootMismatch


  - it: collapses Temporal task queues on web, worker and temporal-django-worker (single worker polls them all)
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_USE_SINGLE_TASK_QUEUE, value: "true"}
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: web
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_USE_SINGLE_TASK_QUEUE, value: "true"}
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: worker
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TEMPORAL_USE_SINGLE_TASK_QUEUE, value: "true"}
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: temporal-django-worker

  - it: shares INTERNAL_REQUEST_TOKEN between web and feature-flags as an optional reference
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTERNAL_REQUEST_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-posthog-env
                key: INTERNAL_REQUEST_TOKEN
                optional: true
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: web
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INTERNAL_REQUEST_TOKEN
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-posthog-env
                key: INTERNAL_REQUEST_TOKEN
                optional: true
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: feature-flags

  - it: reads the new service-to-service secrets from posthog.existingSecret when set
    set:
      posthog.existingSecret: my-posthog
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: recording-api
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RECORDING_API_JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: my-posthog
                key: RECORDING_API_JWT_SECRET
                optional: true

  - it: gives the HyperCache readers the object-storage credentials by reference
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: hypercache-server
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-posthog-env
                key: OBJECT_STORAGE_SECRET_ACCESS_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBJECT_STORAGE_ENDPOINT
            value: http://RELEASE-NAME-posthog-seaweedfs:8333

  - it: passes the signals ClickHouse password to ClickHouse
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: clickhouse
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_SIGNALS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-posthog-env
                key: CLICKHOUSE_SIGNALS_PASSWORD

  - it: renders the AI capture service
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: capture-ai
    asserts:
      - isKind:
          of: Deployment
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: CAPTURE_MODE, value: ai}

  - it: gives the wait-for-migrations init container room for the migration graph
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: wait-for-migrations
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 2Gi

  - it: lets values size the wait-for-migrations init container
    set:
      migrations.waitResources:
        requests: {cpu: 10m, memory: 128Mi}
        limits: {memory: 3Gi}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: worker
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources.limits.memory
          value: 3Gi

  - it: caps temporal-django-worker at 10 parallel activities, overridable by name
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: temporal-django-worker
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_CONCURRENT_ACTIVITIES, value: "10"}

  - it: lets values raise the activity cap of temporal-django-worker
    set:
      services.temporal-django-worker.env:
        - {name: MAX_CONCURRENT_ACTIVITIES, value: "40"}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: temporal-django-worker
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_CONCURRENT_ACTIVITIES, value: "40"}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: MAX_CONCURRENT_ACTIVITIES, value: "10"}

  - it: enables object storage on temporal-django-worker (Replay Vision reads the rendered videos there)
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: temporal-django-worker
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: OBJECT_STORAGE_ENABLED, value: "true"}

  - it: points web, worker and temporal-django-worker at the Gemini gateway when it is on
    set:
      geminiGateway.enabled: true
      secrets.keys.GEMINI_API_KEY: {secret: gemini, key: api-key}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: temporal-django-worker
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: AI_GATEWAY_URL, value: "http://RELEASE-NAME-posthog-gemini-gateway:8080/v1"}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AI_GATEWAY_API_KEY
            valueFrom:
              secretKeyRef: {name: RELEASE-NAME-posthog-env, key: AI_GATEWAY_API_KEY, optional: true}

  - it: gives web the gateway too (scanner drafts and questions run there)
    set:
      geminiGateway.enabled: true
      secrets.keys.GEMINI_API_KEY: {secret: gemini, key: api-key}
      secrets.keys.AI_GATEWAY_API_KEY: {secret: gemini, key: gateway-token}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AI_GATEWAY_API_KEY
            valueFrom:
              secretKeyRef: {name: gemini, key: gateway-token, optional: true}

  - it: leaves other services without the gateway
    set:
      geminiGateway.enabled: true
      secrets.keys.GEMINI_API_KEY: {secret: gemini, key: api-key}
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: plugins
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AI_GATEWAY_URL, value: "http://RELEASE-NAME-posthog-gemini-gateway:8080/v1"}

  - it: sets no gateway env while the gateway is off
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: temporal-django-worker
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: AI_GATEWAY_URL, value: "http://RELEASE-NAME-posthog-gemini-gateway:8080/v1"}
