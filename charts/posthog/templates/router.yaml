{{- /*
Router: Caddy with two listeners generated from upstream's Caddyfile routes.
  app    (:8080) everything, meant to sit behind an identity-aware proxy or private ingress
  ingest (:8081) only the paths SDKs need; identity headers are stripped

With authProxy.enabled the app listener marks what it forwards to web with a shared secret
(AUTH_PROXY_SECRET). web is reachable from every pod of the release, so the identity headers alone
would not tell it that a request came through the proxy.
*/ -}}
{{- include "posthog.authProxyValidate" . -}}
{{- $ap := .Values.authProxy -}}
{{- $secretHeader := include "posthog.authProxySecretHeader" . -}}
{{- $strip := include "posthog.routerStripHeaders" . | fromJsonArray -}}
{{- $up := include "posthog.upstream" . | fromYaml -}}
{{- $root := . -}}
{{- $r := .Values.router -}}
{{- $name := include "posthog.serviceName" (list . "router") -}}
{{- $web := printf "%s:8000" (include "posthog.serviceName" (list . "web")) -}}
{{- define "posthog.routerHandles" -}}
{{- $root := index . 0 }}{{ $routes := index . 1 }}
{{- range $routes }}
{{- if and (not .fallback) (not .excluded) }}
{{- $svcOv := index $root.Values.services .service | default dict }}
{{- $svcEnabled := ternary $svcOv.enabled true (hasKey $svcOv "enabled") }}
{{- if and $svcEnabled (or (not .optional) (hasKey $root.Values.services .service)) }}
    @{{ .name }} {
{{- range .paths }}
        path {{ . }}
{{- end }}
    }
    handle @{{ .name }} {
{{- with .stripPrefix }}
        uri strip_prefix {{ . }}
{{- end }}
        reverse_proxy {{ include "posthog.serviceName" (list $root .service) }}:{{ .port }} {
{{- if .streaming }}
            flush_interval -1
{{- end }}
        }
    }
{{- end }}
{{- end }}
{{- end }}
{{- end -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
data:
  Caddyfile: |
    {
        admin off
        auto_https off
        servers {
            trusted_proxies static private_ranges
        }
    }

    # app listener: full UI and API
    :{{ $r.ports.app }} {
        request_body {
            max_size 64MB
        }
        handle /_router/healthz {
            respond "ok" 200
        }
{{ include "posthog.routerHandles" (list . $up.routes) | indent 4 }}
        handle {
{{- if $ap.enabled }}
            reverse_proxy {{ $web }} {
                header_up {{ $secretHeader }} "{env.AUTH_PROXY_SECRET}"
            }
{{- else }}
            reverse_proxy {{ $web }}
{{- end }}
        }
    }

    # ingest listener: SDK traffic only, identity headers dropped
    :{{ $r.ports.ingest }} {
        request_body {
            max_size 64MB
        }
{{- range $strip }}
        request_header -{{ . }}
{{- end }}
        handle /_router/healthz {
            respond "ok" 200
        }
{{ include "posthog.routerHandles" (list . $up.routes) | indent 4 }}
        @web-public {
{{- range $r.ingest.webPaths }}
            path {{ . }}
{{- end }}
        }
        handle @web-public {
            reverse_proxy {{ $web }}
        }
        handle {
            respond "not found" 404
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  replicas: {{ $r.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" (list . "router") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "posthog.selectorLabels" (list . "router") | nindent 8 }}
      annotations:
        checksum/caddyfile: {{ include "posthog.routerHandles" (list . $up.routes) | sha256sum | trunc 16 }}
        checksum/router-values: {{ toYaml $r | sha256sum | trunc 16 }}
        checksum/auth-proxy: {{ toJson (list $ap.enabled $strip) | sha256sum | trunc 16 }}
    spec:
      {{- include "posthog.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      {{- with include "posthog.podServiceAccountName" (list . "router" "") }}
      serviceAccountName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "posthog.selectorLabels" (list . "router") | nindent 14 }}
      containers:
        - name: caddy
          image: {{ include "posthog.chartImage" (list $ $r.image) | quote }}
          imagePullPolicy: IfNotPresent
          {{- if $ap.enabled }}
          # An empty secret is a header any pod can send. One with a line break or another character
          # that cannot go into a header value (a trailing newline in the Secret, typically) would
          # turn every request to web into a 502. Refuse to start with either.
          command: [/bin/sh, -ec]
          args:
            - |
              [ -n "$AUTH_PROXY_SECRET" ] || { echo "AUTH_PROXY_SECRET is empty" >&2; exit 1; }
              [ "${#AUTH_PROXY_SECRET}" -ge 32 ] || { echo "AUTH_PROXY_SECRET is shorter than 32 characters" >&2; exit 1; }
              case "$AUTH_PROXY_SECRET" in *[!!-~]*) echo "AUTH_PROXY_SECRET must be printable ASCII without spaces or line breaks (trailing newline in the Secret?)" >&2; exit 1 ;; esac
              exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
          {{- else }}
          args: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          {{- end }}
          env:
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: XDG_DATA_HOME
              value: /tmp/data
            {{- if $ap.enabled }}
            {{- $secret := splitn "/" 2 (include "posthog.secretRef" (list . "AUTH_PROXY_SECRET")) }}
            - name: AUTH_PROXY_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $secret._0 }}, key: {{ $secret._1 }}}
            {{- end }}
          ports:
            - name: app
              containerPort: {{ $r.ports.app }}
            - name: ingest
              containerPort: {{ $r.ports.ingest }}
          readinessProbe:
            httpGet: {path: /_router/healthz, port: ingest}
            periodSeconds: 10
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            # The caddy image carries cap_net_bind_service as a file capability with the
            # effective bit; exec fails with EPERM unless the capability is permitted.
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  type: ClusterIP
  selector:
    {{- include "posthog.selectorLabels" (list . "router") | nindent 4 }}
  ports:
    - name: app
      port: {{ $r.ports.app }}
      targetPort: app
    - name: ingest
      port: {{ $r.ports.ingest }}
      targetPort: ingest
{{- if and $r.podDisruptionBudget.enabled (gt (int $r.replicas) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
spec:
  minAvailable: {{ $r.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "posthog.selectorLabels" (list . "router") | nindent 6 }}
{{- end }}
{{- if $r.ingress.enabled }}
{{- $hosts := $r.ingress.hosts }}
{{- if not $hosts }}
{{- $hosts = list (dict "host" (include "posthog.siteHost" .) "listener" "app") }}
{{- if ne (include "posthog.publicHost" .) (include "posthog.siteHost" .) }}
{{- $hosts = append $hosts (dict "host" (include "posthog.publicHost" .) "listener" "ingest") }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "posthog.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
  {{- with $r.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $r.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $r.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  name: {{ .listener | default "app" }}
    {{- end }}
{{- end }}
