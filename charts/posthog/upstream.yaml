    - start
    - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
    - --advertise-kafka-addr internal://{{ include "posthog.host" (list $ "kafka") }}:9092,external://localhost:19092
    - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
    - --advertise-pandaproxy-addr internal://{{ include "posthog.host" (list $ "kafka") }}:8082,external://localhost:18082
    - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
    - --rpc-addr {{ include "posthog.host" (list $ "kafka") }}:33145
    - --advertise-rpc-addr {{ include "posthog.host" (list $ "kafka") }}:33145
    - --mode dev-container
    - --smp 2
    - --memory 3G
    - --reserve-memory 500M
    - --overprovisioned
    - --set redpanda.empty_seed_starts_cluster=false
    - --seeds {{ include "posthog.host" (list $ "kafka") }}:33145
    - --set redpanda.auto_create_topics_enabled=true
    commandTpl: true
    readinessProbe:
      httpGet:
        path: /v1/status/ready
        port: admin
    resources:
      requests:
        cpu: 250m
        memory: 1536Mi
      limits:
        memory: 4Gi
    securityContext:
      runAsUser: 101
      runAsGroup: 101
      fsGroup: 101
    persistence:
      mountPath: /var/lib/redpanda/data
      size: 50Gi
    dependsOn:
    - zookeeper
  kafka-init:
    kind: sidecar
    image: kafka-init
    ports: []
    env: []
    command:
    - /bin/sh
    args:
    - -c
    - "set -x\necho \"Waiting for Kafka broker to accept connections...\"\nTIMEOUT=60\nELAPSED=0\n# Use rpk topic list as\
      \ the readiness check - it's a simple operation\n# that confirms the broker is accepting Kafka protocol requests\nuntil\
      \ rpk topic list --brokers {{ include \"posthog.host\" (list $ \"kafka\") }}:9092 2>/dev/null; do\n    echo \"Kafka\
      \ broker not ready yet (elapsed: ${ELAPSED}s)...\"\n    sleep 2\n    ELAPSED=$((ELAPSED + 2))\n    if [ $ELAPSED -ge\
      \ $TIMEOUT ]; then\n        echo \"Timeout waiting for Kafka broker after ${TIMEOUT}s\"\n        echo \"Final attempt\
      \ to list topics:\"\n        rpk topic list --brokers {{ include \"posthog.host\" (list $ \"kafka\") }}:9092 || true\n\
      \        exit 1\n    fi\ndone\necho \"Kafka broker is accepting requests, creating topics...\"\n# The topic list is\
      \ docker/kafka/topics.txt, mounted below, shared with\n# docker-compose.dev.yml so the two stacks cannot drift apart.\
      \ That header\n# explains what needs pre-creating.\n# Note: $ escapes $ for docker-compose variable substitution\nTOPICS=$(grep\
      \ -vE '^[[:space:]]*#|^[[:space:]]*$' /topics.txt)\nfor topic in $TOPICS; do\n    if rpk topic create \"$topic\" --brokers\
      \ {{ include \"posthog.host\" (list $ \"kafka\") }}:9092 -p 1 -r 1 2>&1; then\n        echo \"Topic $topic created successfully\"\
      \n    else\n        if rpk topic list --brokers {{ include \"posthog.host\" (list $ \"kafka\") }}:9092 | awk '{print\
      \ $1}' | grep -qx \"$topic\"; then\n            echo \"Topic $topic already exists, continuing\"\n        else\n   \
      \         echo \"Failed to create topic $topic\"\n            exit 1\n        fi\n    fi\ndone\necho \"Final topic list:\"\
      \nrpk topic list --brokers {{ include \"posthog.host\" (list $ \"kafka\") }}:9092\necho \"Topics ready\"\n"
    commandTpl: true
    resources: *id001
    securityContext: *id002
    sidecarOf: kafka
    mounts:
    - path: /topics.txt
      file: docker/kafka/topics.txt
      subPath: true
    dependsOn:
    - kafka
