  - /capture/*
  service: capture
  port: 3000
- name: replay-capture
  paths:
  - /s
  - /s/
  - /s/*
  service: replay-capture
  port: 3000
- name: capture-logs
  paths:
  - /i/v1/logs
  - /i/v1/logs/
  - /i/v1/logs/*
  - /i/v1/traces
  - /i/v1/traces/
  - /i/v1/traces/*
  - /i/v1/metrics
