name: Release chart

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: sigstore/cosign-installer@v3
      - name: Check tag matches Chart.yaml version
        run: |
          v=$(grep '^version:' charts/posthog/Chart.yaml | awk '{print $2}')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != chart version $v"; exit 1; }
      - name: Package
        run: helm package charts/posthog -d dist
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push OCI chart
        id: push
        run: |
          out=$(helm push dist/posthog-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts 2>&1)
          echo "$out"
          echo "digest=$(echo "$out" | awk '/Digest:/ {print $2}')" >> "$GITHUB_OUTPUT"
      - name: Sign chart (keyless)
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/charts/posthog@${{ steps.push.outputs.digest }}
      - name: Restore the schema seed CI produced for this upstream commit
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: .seed
          key: schema-seed-${{ hashFiles('charts/posthog/upstream.lock', 'charts/posthog/files/chart/**') }}
      - name: Package the schema seed
        if: steps.seed.outputs.cache-hit == 'true'
        run: |
          v=$(grep '^version:' charts/posthog/Chart.yaml | awk '{print $2}')
          tar -C .seed -czf "dist/posthog-schema-seed-$v.tar.gz" .
          ls -la dist
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Chart `oci://ghcr.io/${{ github.repository_owner }}/charts/posthog` version `${{ github.ref_name }}`, signed with cosign (keyless).

            `posthog-schema-seed-*.tar.gz` is a pre-migrated empty schema (PostgreSQL dump + ClickHouse
            backup) for a fast first start: unpack it on a node or into a PVC and set `seed.hostPath` /
            `seed.existingClaim`. See README "Fast first start".
