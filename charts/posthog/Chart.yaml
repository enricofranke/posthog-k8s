apiVersion: v2
name: posthog
description: >-
  Community Helm chart for self-hosting PostHog on Kubernetes. Generated from PostHog's hobby
  docker-compose at a pinned upstream commit. Includes session replay, error tracking, logs,
  feature flags and the full ingestion pipeline. Not affiliated with PostHog Inc.
type: application
version: 0.1.1
appVersion: "18b824b7932ad13f25602b4ea0376fc568ac4b22"
kubeVersion: ">=1.30.0-0"
home: https://github.com/enricofranke/posthog-k8s
sources:
  - https://github.com/enricofranke/posthog-k8s
  - https://github.com/PostHog/posthog
keywords:
  - posthog
  - analytics
  - session-replay
  - error-tracking
  - feature-flags
  - observability
maintainers:
  - name: Enrico Franke
    url: https://github.com/enricofranke
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Upstream compose files this chart is generated from
      url: https://github.com/PostHog/posthog/blob/master/docker-compose.hobby.yml
