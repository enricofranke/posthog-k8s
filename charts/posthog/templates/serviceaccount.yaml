{{- $accounts := list }}
{{- if .Values.serviceAccount.create }}
{{- $accounts = append $accounts (dict "name" (include "posthog.serviceAccountName" .) "component" "" "sa" .Values.serviceAccount) }}
{{- end }}
{{- if .Values.objectStorage.serviceAccount.create }}
{{- $accounts = append $accounts (dict "name" (include "posthog.objectStorageServiceAccountName" .) "component" "object-storage" "sa" .Values.objectStorage.serviceAccount) }}
{{- end }}
{{- range $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "posthog.labels" $ | nindent 4 }}
    {{- with .component }}
    app.kubernetes.io/component: {{ . }}
    {{- end }}
    {{- with .sa.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .sa.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
