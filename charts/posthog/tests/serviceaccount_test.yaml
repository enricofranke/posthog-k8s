suite: service accounts and keyless object storage
templates:
  - serviceaccount.yaml
  - workloads.yaml
  - jobs.yaml
  - secrets.yaml
tests:
  - it: renders no ServiceAccount and no serviceAccountName by default
    template: workloads.yaml
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: creates the release ServiceAccount with its annotations
    template: serviceaccount.yaml
    set:
      serviceAccount.create: true
      serviceAccount.annotations:
        example.com/identity: posthog
      serviceAccount.labels:
        team: analytics
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: RELEASE-NAME-posthog
      - equal:
          path: metadata.annotations
          value:
            example.com/identity: posthog
      - equal:
          path: metadata.labels.team
          value: analytics
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: runs every pod as the created ServiceAccount
    template: workloads.yaml
    set:
      serviceAccount.create: true
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: clickhouse
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-posthog

  - it: uses an existing ServiceAccount by name without creating one
    templates:
      - serviceaccount.yaml
      - workloads.yaml
    set:
      serviceAccount.name: shared
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shared
        template: workloads.yaml
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: web

  - it: lets one service run as another ServiceAccount
    template: workloads.yaml
    set:
      serviceAccount.create: true
      services.capture.serviceAccountName: capture-only
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: capture
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: capture-only

  - it: gives the object storage ServiceAccount only to services that use object storage
    templates:
      - serviceaccount.yaml
      - workloads.yaml
    set:
      serviceAccount.create: true
      objectStorage.serviceAccount.create: true
      objectStorage.serviceAccount.annotations:
        example.com/identity: storage
    asserts:
      - hasDocuments:
          count: 2
        template: serviceaccount.yaml
      - equal:
          path: metadata.annotations
          value:
            example.com/identity: storage
        template: serviceaccount.yaml
        documentIndex: 1
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-posthog-object-storage
        template: workloads.yaml
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: web
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-posthog-object-storage
        template: workloads.yaml
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: feature-flags
      - equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-posthog
        template: workloads.yaml
        documentSelector:
          path: spec.template.spec.containers[0].name
          value: clickhouse

  - it: runs the migrate Job as the object storage ServiceAccount
    template: jobs.yaml
    set:
      objectStorage.serviceAccount.name: storage
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: migrate
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: storage

  - it: renders object storage keys as empty values with auth serviceAccount
    template: workloads.yaml
    set:
      objectStorage.endpoint: https://s3.example.com
      objectStorage.auth: serviceAccount
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBJECT_STORAGE_ACCESS_KEY_ID
            value: ""
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBJECT_STORAGE_SECRET_ACCESS_KEY
            value: ""
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_RECORDING_V2_S3_ACCESS_KEY_ID
            value: ""

  - it: blanks the AWS_* keys the Rust services read as well
    template: workloads.yaml
    set:
      objectStorage.endpoint: https://s3.example.com
      objectStorage.auth: serviceAccount
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: feature-flags
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ACCESS_KEY_ID
            value: ""

  - it: keeps session replay keys when session replay has its own credentials
    template: workloads.yaml
    set:
      objectStorage.endpoint: https://s3.example.com
      objectStorage.auth: serviceAccount
      sessionReplay.storage.existingSecret: replay-keys
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_RECORDING_V2_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: replay-keys
                key: accessKeyId
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OBJECT_STORAGE_ACCESS_KEY_ID
            value: ""

  - it: keeps object storage keys out of the chart Secret with auth serviceAccount
    template: secrets.yaml
    set:
      objectStorage.endpoint: https://s3.example.com
      objectStorage.auth: serviceAccount
    asserts:
      - notExists:
          path: data.OBJECT_STORAGE_ACCESS_KEY_ID
      - notExists:
          path: data.OBJECT_STORAGE_SECRET_ACCESS_KEY
      - notExists:
          path: data.SESSION_RECORDING_ACCESS_KEY_ID

  - it: refuses auth serviceAccount with the bundled object storage
    template: secrets.yaml
    set:
      objectStorage.auth: serviceAccount
    asserts:
      - failedTemplate:
          errorPattern: "needs an external objectStorage.endpoint"

  - it: refuses an unknown auth mode
    template: secrets.yaml
    set:
      objectStorage.auth: iam
    asserts:
      - failedTemplate:
          errorPattern: "objectStorage.auth must be keys or serviceAccount"

  - it: mounts a projected token and sets web-identity env with webIdentity
    template: workloads.yaml
    set:
      objectStorage.endpoint: https://s3.example.com
      objectStorage.auth: serviceAccount
      objectStorage.webIdentity.enabled: true
      objectStorage.webIdentity.roleArn: arn:example:iam::1:role/posthog
      objectStorage.webIdentity.audience: sts.example.com
      objectStorage.webIdentity.stsEndpoint: https://sts.example.com
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: web
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ROLE_ARN
            value: arn:example:iam::1:role/posthog
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/posthog/web-identity/token
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AWS_ENDPOINT_URL_STS
            value: https://sts.example.com
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: web-identity-token
            mountPath: /var/run/secrets/posthog/web-identity
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: web-identity-token
            projected:
              sources:
                - serviceAccountToken:
                    audience: sts.example.com
                    expirationSeconds: 3600
                    path: token

  - it: does not mount the web-identity token into services without object storage
    template: workloads.yaml
    set:
      objectStorage.endpoint: https://s3.example.com
      objectStorage.auth: serviceAccount
      objectStorage.webIdentity.enabled: true
      objectStorage.webIdentity.roleArn: arn:example:iam::1:role/posthog
    documentSelector:
      path: spec.template.spec.containers[0].name
      value: clickhouse
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: web-identity-token
          any: true

  - it: requires a role for webIdentity
    template: workloads.yaml
    set:
      objectStorage.endpoint: https://s3.example.com
      objectStorage.auth: serviceAccount
      objectStorage.webIdentity.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "webIdentity.enabled needs objectStorage.webIdentity.roleArn"
