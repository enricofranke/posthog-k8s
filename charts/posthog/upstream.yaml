excluded:
  db: bundled PostgreSQL is rendered from the chart's own template (or an external database is used)
  proxy: replaced by the chart's router (Caddy) which has an ingest listener and an app listener
  objectstorage: legacy MinIO used only by the hobby storage migration; S3-compatible storage is configured instead
  seaweedfs: replaced by S3-compatible object storage (external or bundled SeaweedFS from the chart's own template)
  elasticsearch: Temporal runs with PostgreSQL visibility (ENABLE_ES=false in hobby), so no Elasticsearch
  temporal-admin-tools: interactive debugging container, not a workload
  temporal-ui: optional UI, not part of the chart
