  - /flags/*
  - /api/feature_flag/local_evaluation
  - /api/feature_flag/local_evaluation/
  - /api/feature_flag/local_evaluation/*
  service: feature-flags
  port: 3001
- name: surveys
  paths:
  - /surveys
  - /surveys/
  - /api/surveys
  - /api/surveys/
  service: hypercache-server
  port: 3002
- name: remote-config
  paths:
  - /array/*
  service: hypercache-server
  port: 3002
- name: webhooks
  paths:
  - /public/webhooks
  - /public/webhooks/
  - /public/webhooks/*
  - /public/m/
  - /public/m/*
  service: plugins
  port: 6738
- name: objectstorage
  paths:
  - /posthog
  - /posthog/
  - /posthog/*
  service: objectstorage
  port: 19000
  excluded: true
- name: app
  paths:
  - /*
  service: web
  port: 8000
  fallback: true
