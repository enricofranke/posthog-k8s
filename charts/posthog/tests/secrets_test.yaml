suite: secrets
templates:
  - secrets.yaml
tests:
  - it: builds DATABASE_URL for the bundled PostgreSQL from the configured password
    set:
      postgresql.auth.password: pw
      posthog.secrets.secretKey: k
      posthog.secrets.encryptionSaltKeys: s
      posthog.secrets.browserlessToken: b
      posthog.secrets.internalApiSecret: i
    asserts:
      - equal:
          path: data.DATABASE_URL
          value: cG9zdGdyZXM6Ly9wb3N0aG9nOnB3QFJFTEVBU0UtTkFNRS1wb3N0aG9nLXBvc3RncmVzcWw6NTQzMi9wb3N0aG9n
      - equal:
          path: data.SECRET_KEY
          value: aw==

  - it: leaves out keys that live in the user's Secrets
    set:
      posthog.existingSecret: my-posthog
      postgresql.external.host: pg
      postgresql.external.existingSecret: my-pg
      postgresql.external.urlKey: uri
      postgresql.external.passwordKey: password
    asserts:
      - notExists:
          path: data.SECRET_KEY
      - notExists:
          path: data.DATABASE_URL
      - notExists:
          path: data.PGPASSWORD

  - it: fails when generation is off and a value is missing
    set:
      secrets.generate: false
    asserts:
      - failedTemplate:
          errorPattern: "secret key [A-Z_]+ has no value"

  - it: fails when an external object storage has no credentials
    set:
      objectStorage.endpoint: https://s3.example.com
    asserts:
      - failedTemplate:
          errorPattern: "objectStorage.endpoint is set"

  - it: generates the new service-to-service secrets and the signals ClickHouse password
    set:
      posthog.secrets.internalRequestToken: irt
      posthog.secrets.recordingApiJwtSecret: jwt
      clickhouse.users.signals: sig
    asserts:
      - equal:
          path: data.INTERNAL_REQUEST_TOKEN
          value: aXJ0
      - equal:
          path: data.RECORDING_API_JWT_SECRET
          value: and0
      - equal:
          path: data.CLICKHOUSE_SIGNALS_PASSWORD
          value: c2ln

  - it: leaves the new service-to-service secrets to posthog.existingSecret
    set:
      posthog.existingSecret: my-posthog
    asserts:
      - notExists:
          path: data.INTERNAL_REQUEST_TOKEN
      - notExists:
          path: data.RECORDING_API_JWT_SECRET
