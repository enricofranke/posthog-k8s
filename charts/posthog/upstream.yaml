  service: livestream
  port: 8080
  stripPrefix: /livestream
  streaming: true
- name: capture-ai
  paths:
  - /i/v0/ai
  - /i/v0/ai/
  - /i/v0/ai/*
  service: capture-ai
  port: 3000
  optional: true
- name: capture
  paths:
  - /e
  - /e/
  - /e/*
  - /i/v0
  - /i/v0/
  - /i/v0/*
