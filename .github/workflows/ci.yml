name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install kubeconform and helm-unittest
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
          helm plugin install https://github.com/helm-unittest/helm-unittest --version 1.0.1
      - name: Generator tests
        run: make test-tools
      - name: Generated chart data is in sync with tools/rules.yaml
        run: make sync-check
      - name: helm lint
        run: make lint
      - name: helm unittest
        run: make unittest
      - name: kubeconform (default values and every values file in charts/posthog/ci)
        run: make kubeconform
      - name: Validate the rendered Caddyfile with caddy
        run: make caddy-validate

  e2e:
    name: End-to-end on kind
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: posthog
          node_image: kindest/node:v1.33.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Restore schema seed for this upstream commit
        id: seed
        uses: actions/cache/restore@v4
        with:
          path: .seed
          key: schema-seed-${{ hashFiles('charts/posthog/upstream.lock', 'charts/posthog/files/chart/**') }}
      - name: Load seed into the kind node
        if: steps.seed.outputs.cache-hit == 'true'
        run: |
          docker cp .seed posthog-control-plane:/seed
          docker exec posthog-control-plane ls -la /seed /seed/clickhouse
          echo "EXTRA_VALUES=charts/posthog/ci/seed-values.yaml" >> "$GITHUB_ENV"
      - name: Install
        run: make e2e-install
      - name: Export schema seed
        if: steps.seed.outputs.cache-hit != 'true'
        run: e2e/export-seed.sh .seed
      - name: Smoke tests
        run: make e2e-test
      - name: Save schema seed
        if: steps.seed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .seed
          key: schema-seed-${{ hashFiles('charts/posthog/upstream.lock', 'charts/posthog/files/chart/**') }}
      - name: Diagnostics on failure
        if: failure()
        run: e2e/diagnose.sh posthog
